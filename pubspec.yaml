name: distress
description: "Distress Detection AI - Edge-Powered Safety Signals"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Sensors
  sensors_plus: ^6.0.1

  # Location
  geolocator: ^12.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Audio recording
  record: 5.1.2

  # On-device AI
  tflite_flutter: ^0.11.0

  # Local storage
  shared_preferences: ^2.2.3

  # Open dialer / SMS / maps
  url_launcher: ^6.3.0

  # Temporary audio files
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/